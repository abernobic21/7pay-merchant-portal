services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env

  auth-service:
    build: ./services/auth-service
    #ports:
    #  - "8081:8081"

  core-service:
    build: ./services/core-service
    env_file:
      - ./services/core-service/.env
    # ports:
    #   - "8082:8082"

  user-management-service:
    build: ./services/user-management-service
    env_file:
      - ./database/.env
    depends_on:
      - user-database
    restart: on-failure
    #ports:
    #  - "8083:8083"

  user-database:
    image: postgres:16-alpine
    env_file:
      - ./database/.env
    volumes:
      - user_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  report-service:
    build: ./services/report-service
    #ports:
    #  - "8084:8084"

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - auth-service
      - core-service
      - user-management-service
      - report-service

volumes:
  user_db_data:
