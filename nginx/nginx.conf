events {}

http {
  upstream auth-service     { server auth-service:8081; }
  upstream core-service     { server core-service:8082; }
  upstream user-service     { server user-management-service:8083; }
  upstream report-service   { server report-service:8084; }

  server {
    listen 80;

    location / {
      proxy_pass http://frontend:5173;
    }

    location /api/v1/auth {
      proxy_pass http://auth-service/api/v1/auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /api/v1/users { 
      proxy_pass http://user-service/api/v1/users;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /api/v1/reports { 
      proxy_pass http://report-service/api/v1/reports;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1 { 
      proxy_pass http://core-service/api/v1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}